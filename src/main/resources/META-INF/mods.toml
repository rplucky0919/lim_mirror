credits="感谢所有测试者的反馈 / Thanks to all testers for their feedback"
authors="WZ"
description='''
边狱巴士镜牢饰品 (Lim Mirror) — 以呼吸法为核心战斗机制的 Minecraft 饰品模组。
Lim Mirror — a Minecraft curios mod featuring a Poise-based combat system inspired by Limbus Company.

【核心玩法 / Core Gameplay】
- 呼吸法 / Poise：攻击时消耗呼吸法时间，每级提供5%暴击率 / +5% crit chance per level
- 呼吸顺畅 / Breath Smooth：攻击敌人获得呼吸法 / gain Poise on hit

【饰品系统 / Curios System】
- 烟斗 / Pipe：呼吸法充足时伤害+2 / +2 damage while Poise is high
- 石冢 / Stone Mound：呼吸顺畅时间翻倍，击杀获得呼吸法 / doubled Breath Smooth duration, gain Poise on kill
- 四叶草 / Clover：暴击时获得额外呼吸法（5秒冷却） / extra Poise on crit (5s cooldown)

更多内容持续开发中... / More content in development...
'''

