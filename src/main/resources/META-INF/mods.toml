description='''
镜界 (Lim Mirror) 是一个以呼吸法为核心战斗机制的 Minecraft 模组。

【核心玩法】
- 呼吸法：攻击时消耗呼吸法时间，每级提供5%暴击率
- 呼吸顺畅附魔：攻击敌人获得呼吸法效果

【饰品系统】
- 烟斗：呼吸法充足时伤害+2
- 石冢：呼吸顺畅时间翻倍，击杀获得呼吸法
- 四叶草：暴击时获得额外呼吸法（5秒冷却）

更多内容持续开发中...
'''

